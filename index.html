<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>ApolloqA - Sound Co-Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/favicon.svg">

    <!-- Babylon.js
    <script src="https://cdn.jsdelivr.net/npm/babylonjs@6.10.0/babylon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@6.10.0/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylon.gridMaterial.min.js></script>
    -->

</head>
<body>

<canvas id="apolloqa_canvas"></canvas>

<div id="footer" style="width:100%" >
    <output id="display_net_status">◐</output>
    <output id="netSession0" hidden></output>
    <output id="netSession1" hidden></output>
    <output id="netSession2" hidden></output>
    <output id="netSession3" hidden></output>
    <output id="netSession4" hidden></output>
    <output id="footer_text" class="blink-element"></output>
</div>

<div class="wrapper" style="width:100%;background:transparent;">
    <div id="menu_buttons" class="buttons">
        <button id="menu_main" hidden><img src="favicon_trans_bg.svg" style="display:block;width:60px;height:60px;" /></button>
        <button id="menu_autoplay" hidden>Auto</button>
        <button id="menu_gen" hidden>Generator</button>
        <button id="menu_mic" hidden>Microphone</button>
    </div>

    <section class="main_controls">

        <div id="menu_header" class="config_div">
            <p>
                <output id="display_header">ApolloqA</output>
            </p>
            <p class="text-justify" id="display_chords" style="font-size: 1rem;"></p>
            <progress id="display_progress" style="width:100%;" max="1" value="0"></progress>
        </div>

        <div id="config_gen" class="config_div" hidden>
            soundset<br/>
            <select id="select_instrument"></select><br/>

            <table><tr><td style="width:30%">
                quantize<br/>
                <select id="select_quantize"></select>
            </td><td style="width:30%">
                low octave<br/>
                <select id="select_min_octave"></select>
            </td><td style="width:30%">
                high octave<br/>
                <select id="select_max_octave"></select><br/>
            </td></tr></table>

            rhythmic structure<br/>
            <div id="step_sequencer" class="buttons">
                <button id="step_3_0">D1</button>
                <button id="step_3_1">D2</button>
                <button id="step_3_2">D3</button>
                <button id="step_3_3">D4</button>
                <button id="step_3_4">D5</button>
                <button id="step_3_5">D6</button>
                <button id="step_3_6">D7</button>
                <button id="step_3_7">D8</button>
            </div>
            <div id="step_sequencer" class="buttons">
                <button id="step_2_0">C1</button>
                <button id="step_2_1">C2</button>
                <button id="step_2_2">C3</button>
                <button id="step_2_3">C4</button>
                <button id="step_2_4">C5</button>
                <button id="step_2_5">C6</button>
                <button id="step_2_6">C7</button>
                <button id="step_2_7">C8</button>
            </div>
            <div id="step_sequencer" class="buttons">
                <button id="step_1_0">B1</button>
                <button id="step_1_1">B2</button>
                <button id="step_1_2">B3</button>
                <button id="step_1_3">B4</button>
                <button id="step_1_4">B5</button>
                <button id="step_1_5">B6</button>
                <button id="step_1_6">B7</button>
                <button id="step_1_7">B8</button>
            </div>
            <div id="step_sequencer" class="buttons">
                <button id="step_0_0">A1</button>
                <button id="step_0_1">A2</button>
                <button id="step_0_2">A3</button>
                <button id="step_0_3">A4</button>
                <button id="step_0_4">A5</button>
                <button id="step_0_5">A6</button>
                <button id="step_0_6">A7</button>
                <button id="step_0_7">A8</button>
            </div>
            <div id="step_sequencer" class="buttons">
                <button id="steps_random">Random</button>
                <button id="steps_builtin_0">Saw</button>
                <button id="steps_builtin_1">Humpa</button>
                <button id="steps_builtin_2">Humpaba</button>
                <button id="steps_builtin_3">All On</button>
                <button id="steps_builtin_4">All Off</button>
            </div>
            <div style="margin: 1rem 0 0 0;">
                <table style="width:100%;"><tr><td style="width:70%;">
                    <button id="calc_button" class="blink-element" style="width:100%;">Generate New Sound</button>
                </td><td>
                    <input id="close_after_calc" type="checkbox" style="width:3rem; height: 3rem;" checked>Close after</checkbox>
                </td></tr></table>
            </div>
        </div>

        <div id="config_session" class="config_div" hidden>
            <table width="100%">
                <tr><td>
                    chord progression<br/>
                    <select id="select_chords"></select><br/>
                </td><td>
                    beats per chord<br/>
                    <select id="select_beats_per_chord"></select><br/>
                </td></tr>
            </table>
            tempo<br/>
            <div class="flexbox">
                <button id="dec_bpm" class="narrow">-</button>
                <input id="range_bpm" type="range" min="40" max="240" value="120" step="1"></input>
                <button id="inc_bpm" class="narrow">+</button>
                <output id="display_bpm" style="font-size: 3rem;">120</output> BPM
            </div>
            <div class="flexbox">
                    <button id="new_session">ENTER</button>
            </div>
        </div>

        <div id="config_mic" class="config_div" hidden>
            <canvas id="audiorec_visualizer"></canvas>
            <div class="buttons">
                <button id="record">Rec</button>
                <button id="stop">Stop</button>
            </div>
            <br/>
            Developers only
            <br/>
            <button id="debug_layer_button">debug layer</button>
        </div>
    </section>
</div>


<div id="config_navi" class="config_div" hidden>
    speed<br/>
    <input id="range_speed" type="range" min="0" max="4" value="0" step="0.1"></input><br/>
    camera<br/>
    <input id="range_camera" type="range" min="1" max="100" value="1" step="0.1"></input>
</div>

<button id="menu_exit"><img src="x.svg" style="display:block;width:60px;height:60px;" /></button>
<button id="menu_navi" hidden>Navi</button>

<div id="start_overlay">
    <button id="startAudioButton" class="blink-element" disabled>Loading</button>
</div>

<div class="login-overlay" id="loginOverlay">
    <div class="login-center">
        <div class="login-container" id="loginContainer" hidden>
            <div class="login-card">
                <div class="login-header">
                    <div class="neu-icon">
                        <div class="icon-inner">
                            <img width="40" height="40" src="../favicon.svg" />
                        </div>
                    </div>
                </div>

                <form class="login-form" id="loginForm" novalidate>
                    <div class="form-group">
                        <div class="input-group neu-input">
                            <input type="nickname" id="nickname" name="nickname" required autocomplete="nickname" placeholder=" ">
                            <label for="nickname">Nickname</label>
                        </div>
                        <span class="error-message" id="nicknameError"></span>
                    </div>

                    <button type="submit" class="neu-button login-btn">
                        <span class="btn-text">Check-in</span>
                        <div class="btn-loader">
                            <div class="neu-spinner"></div>
                        </div>
                    </button>
                </form>

                <div class="success-message" id="successMessage">
                    <div class="success-icon neu-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <h3>Success!</h3>
                    <p>Redirecting to scene...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/lib/babylon.js"></script>
<script src="js/lib/babylonjs.loaders.min.js"></script>
<script src="js/lib/babylon.gridMaterial.min.js"></script>
<script src="js/lib/babylon.gui.js"></script>

<script type="module" src="js/initScene.js"></script>

</body>
</html>
