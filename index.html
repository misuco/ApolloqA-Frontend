<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>ApolloqA - Sound Co-Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/favicon.svg">

    <!-- Babylon.js
    <script src="https://cdn.jsdelivr.net/npm/babylonjs@6.10.0/babylon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@6.10.0/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylon.gridMaterial.min.js></script>
    -->

</head>
<body style="background:black">

<canvas id="apolloqa_canvas"></canvas>

<div class="wrapper" style="width:100%;background:transparent">
    <section class="main_controls">

        <div id="menu_header">
            <output id="display_header" style="font-size: 1rem;">ApolloqA</output>
            <progress id="display_progress"  style="width:100%;height:10%;" max="1" value="0"></progress>
        </div>

        <div id="menu_buttons" class="buttons">
            <button id="menu_main" hidden>|||</button>
            <button id="menu_autoplay" hidden>Auto</button>
            <button id="menu_navi" hidden>Navi</button>
            <button id="menu_gen" hidden>Gen</button>
            <button id="menu_mic" hidden>Mic</button>
            <button id="menu_exit" hidden>Exit</button>
        </div>

        <div id="config_navi" class="config_div" hidden>
            speed<br/>
            <input id="range_speed" type="range" min="0" max="4" value="0" step="0.1"></input><br/>
            camera<br/>
            <input id="range_camera" type="range" min="1" max="100" value="1" step="0.1"></input>
        </div>

        <div id="config_gen" class="config_div" hidden>
            <h3>1. Set generator parameters</h3>
            soundset<br/>
            <select id="select_instrument_0"></select><br/>
            quantize<br/>
            <select id="select_quantize_0"></select><br/>
            rhythmic structure<br/>
            <div id="step_sequencer" class="buttons">
                <button id="step_0">1</button>
                <button id="step_1">2</button>
                <button id="step_2">3</button>
                <button id="step_3">4</button>
                <button id="step_4">5</button>
                <button id="step_5">6</button>
                <button id="step_6">7</button>
                <button id="step_7">8</button>
            </div>
            <h3>2. Run generator</h3>
            <button id="calc_button">Generate New Sound</button>
        </div>

        <div id="config_session" class="config_div" hidden>
            <table width="100%">
                <tr><td>
                    chord progression<br/>
                    <select id="select_chords"></select><br/>
                </td><td>
                    beats per chord<br/>
                    <select id="select_beats_per_chord"></select><br/>
                </td></tr>
            </table>
            tempo<br/>
            <div class="flexbox">
                <button id="dec_bpm" class="narrow">-</button>
                <input id="range_bpm" type="range" min="40" max="240" value="120" step="1"></input>
                <button id="inc_bpm" class="narrow">+</button>
                <output id="display_bpm" style="font-size: 3rem;">120</output> BPM
            </div>
            <div class="flexbox">
                    <button id="new_session">ENTER</button>
            </div>
        </div>

        <div id="config_mic" class="config_div" hidden>
            <canvas id="audiorec_visualizer"></canvas>
            <div class="buttons">
                <button id="record">Rec</button>
                <button id="stop">Stop</button>
            </div>
            <br/>
            Developers only
            <br/>
            <button id="debug_layer_button">debug layer</button>
        </div>

        <div class="buttons">
            <button id="netSession0" hidden></button>
            <button id="netSession1" hidden></button>
            <button id="netSession2" hidden></button>
            <button id="netSession3" hidden></button>
            <button id="netSession4" hidden></button>
        </div>
    </section>

</div>

<div id="aqa_dialog_loading" hidden>
    <output id="loading_text">Loading</output><output id="display_net_status_loading">◐</output>
    <progress id="loading_progress" max="1" value="0"></progress>
</div>

<div id="start_overlay">
    <button id="startAudioButton">Loading</button>
</div>

<output id="display_net_status">◐</output>

<script src="js/lib/babylon.js"></script>
<script src="js/lib/babylonjs.loaders.min.js"></script>
<script src="js/lib/babylon.gridMaterial.min.js"></script>
<script src="js/lib/babylon.gui.js"></script>

<script type="module" src="js/initScene.js"></script>

</body>
</html>
